<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>NOX</title>

    <meta name="theme-color" content="#0d0d0d">
    <meta name="description" content="Juego interactivo para parejas">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div id="app">

    <!-- Fondo -->
    <div id="background"></div>

    <!-- Pantalla Inicio -->
    <section id="homeScreen" class="screen active">

        <div class="logoContainer">

            <h1 class="logo">
                NOX
            </h1>

            <p class="subtitle">
                Un juego.<br>
                Miles de momentos.
            </p>

        </div>

        <button id="playButton" class="goldButton">
            JUGAR
        </button>

    </section>

    <!-- Selección -->
    <section id="deckScreen" class="screen">

        <h2>
            Selecciona un mazo
        </h2>

        <div class="deckGrid">

            <button class="deck previa">
    <span>PREVIA</span>
</button>

            <button class="deck accion">
    <span>ACCION</span>
</button>

            <button class="deck poses">
    <span>POSES</span>
</button>

            <button class="deck aleatorio">
    <span>ALEATORIO</span>
</button>

        </div>

    </section>

    <!-- Carta -->
    <section id="gameScreen" class="screen">

        <div id="card">

            <div id="card">

    <div class="cardInner">

        <div class="cardFace cardFront">

            <div class="cardTitle">
                NOX
            </div>

            <div class="cardSubtitle">
                Toca para descubrir
            </div>

        </div>

        <div class="cardFace cardBack">

            <h3 id="cardCategory">
                PREVIA
            </h3>

            <p id="cardText">

            </p>

        </div>

    </div>

</div>

        </div>

        <div class="gameButtons">

            <button id="nextCard" class="goldButton">
                SIGUIENTE
            </button>

            <button id="backButton" class="secondaryButton">
                VOLVER
            </button>

        </div>

    </section>

</div>

<script src="js/storage.js"></script>
<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/animations.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
